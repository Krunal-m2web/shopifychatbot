<!DOCTYPE html>
<html>
  <head>
    <title>Chat Test</title>
    <style>
      body {
        font-family: Arial;
        max-width: 600px;
        margin: 50px auto;
      }

      #messages {
        border: 1px solid #ccc;
        height: 400px;
        overflow-y: auto;
        padding: 10px;
        margin-bottom: 10px;
      }

      .message {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }

      .user {
        background: #e3f2fd;
        text-align: right;
      }

      .assistant {
        background: #f5f5f5;
      }

      #input {
        width: 80%;
        padding: 10px;
      }

      #send {
        padding: 10px 20px;
      }
    </style>
  </head>

  <body>
    <h1>Chat Test</h1>

    <div id="messages"></div>

    <input type="text" id="input" placeholder="Ask about products..." />
    <button id="send">Send</button>

    <script>
      let sessionId = null;

      async function sendMessage() {
        const input = document.getElementById("input");
        const message = input.value.trim();

        if (!message) return;

        // Add user message to UI
        addMessage("user", message);
        input.value = "";

        try {
          const baseUrl = window.location.hostname === 'localhost' ? "http://localhost:5173" : window.location.origin;
          const response = await fetch(`${baseUrl}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, sessionId }),
          });

          const data = await response.json();
          sessionId = data.sessionId;

          // Add assistant response
          addMessage("assistant", data.message);

          // Show sources if any
          if (data.sources && data.sources.length > 0) {
            const sourceText =
              "Sources: " + data.sources.map((s) => s.title).join(", ");
            addMessage("assistant", sourceText, true);
          }
        } catch (error) {
          addMessage("assistant", "Error: " + error.message);
        }
      }

      function addMessage(role, content, isSource = false) {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.style.fontSize = isSource ? "12px" : "14px";
        div.style.opacity = isSource ? "0.7" : "1";
        div.textContent = content;

        document.getElementById("messages").appendChild(div);
        div.scrollIntoView();
      }

      document.getElementById("send").onclick = sendMessage;

      document.getElementById("input").onkeypress = (e) => {
        if (e.key === "Enter") sendMessage();
      };
    </script>
  </body>
</html>
